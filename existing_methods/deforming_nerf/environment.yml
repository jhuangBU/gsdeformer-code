# run: conda env create -f environment.yml
name: deforming-nerf
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.8.8
  - numpy>=1.16.4,<1.19.0
  - pip
  - pip:
      - dill==0.3.8
      - ipdb==0.13.13
      - lpips==0.1.4
      - opencv-python>=4.4.0
      - Pillow>=7.2.0
      - pyyaml>=5.3.1
      - tensorboard>=2.4.0
      - imageio==2.34.1
      - imageio-ffmpeg==0.4.9
      - pymcubes==0.1.4
      - moviepy==1.0.3
      - matplotlib==3.7.5
      - scipy>=1.6.0
      - pyrender==0.1.45
      - Rtree==1.2.0
  - pytorch=1.13.1=py3.8_cuda11.7_*
  - torchvision=0.14.1=py38_cu117
  - cuda-libraries-dev=11.7
  - cuda-nvcc=11.7
  - cuda-cccl=11.7
  - tqdm